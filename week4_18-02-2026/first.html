<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        section {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>John Doe</h1>
    <p>Web Developer</p>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <h2>About Me</h2>
    <div class="card">
        <p>Hello! I'm learning web development and building awesome projects.</p>
    </div>
</section>

<section id="projects">
    <h2>Projects</h2>
    <div class="card">
        <h3>Project 1</h3>
        <p>A cool website built using HTML & CSS.</p>
    </div>
    <div class="card">
        <h3>Project 2</h3>
        <p>A JavaScript game project.</p>
    </div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <div class="card">
        <form>
            <label>Name:</label><br>
            <input type="text"><br><br>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <label>Message:</label><br>
            <textarea rows="4"></textarea><br><br>

            <button type="submit">Send</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
