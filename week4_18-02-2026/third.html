<!DOCTYPE html>
<html>
<head>
    <title>ProGamer Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
        }

        header {
            background: #111;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #00ffcc;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        nav a:hover {
            color: #00ffcc;
        }

        .hero {
            height: 80vh;
            background: url('https://picsum.photos/1600/900?gaming') no-repeat center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h2 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            background: #00ffcc;
            cursor: pointer;
            border-radius: 5px;
        }

        .hero button:hover {
            background: #00ccaa;
        }

        .games {
            padding: 50px;
            text-align: center;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-card {
            background: #1c1c1c;
            margin: 20px;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .game-card:hover {
            transform: scale(1.05);
            background: #292929;
        }

        .game-card img {
            width: 100%;
            border-radius: 10px;
        }

        footer {
            background: #111;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🎮 ProGamer Hub</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Games</a>
        <a href="#">Tournaments</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to the Ultimate Gaming Zone</h2>
    <button onclick="joinNow()">Join Now</button>
</section>

<section class="games">
    <h2>Popular Games</h2>
    <div class="game-container">
        <div class="game-card">
            <img src="https://picsum.photos/300/200?1">
            <h3>Battle Arena</h3>
            <p>Action-packed multiplayer battles.</p>
        </div>

        <div class="game-card">
            <img src="https://picsum.photos/300/200?2">
            <h3>Speed Racer</h3>
            <p>High-speed racing experience.</p>
        </div>

        <div class="game-card">
            <img src="https://picsum.photos/300/200?3">
            <h3>Zombie Survival</h3>
            <p>Survive the apocalypse.</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 ProGamer Hub | All Rights Reserved</p>
</footer>

<script>
    function joinNow() {
        alert("Welcome to ProGamer Hub! 🎮");
    }
</script>

</body>
</html>
